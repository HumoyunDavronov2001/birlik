# The Omnarc relay: iroh-relay 1.3 with a Let's Encrypt certificate, QUIC address discovery for hole punching, and a
# shared token, so only your clusters use it. See relay/README.md.
enable_relay = true
http_bind_addr = "[::]:80"
enable_quic_addr_discovery = true
enable_metrics = false

[tls]
cert_mode = "LetsEncrypt"
hostname = "relay.example.com"
contact = "you@example.com"
cert_dir = "/var/lib/omnarc-relay/certs"

[access]
# replaced by IROH_RELAY_ACCESS_TOKEN from /etc/omnarc-relay/token.env; never commit a real token
shared_token = ["set-in-token.env"]

[limits]
accept_conn_limit = 50.0
accept_conn_burst = 100
