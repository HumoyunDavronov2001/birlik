[package]
name = "birlik-engine-host"
description = "Runs the BIRLIK engine (libbirlik) in its own process and talks to it through shared memory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
birlik-protocol.workspace = true

[features]
# Integration tests that drive a real birlik-engine process; they need BIRLIK_ENGINE and BIRLIK_TEST_MODEL.
engine-tests = []

[[test]]
name = "engine"
required-features = ["engine-tests"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }

# The workspace forbids unsafe code; mapping shared memory needs it, so this crate denies it everywhere except
# src/shm.rs, where every unsafe block documents why it is sound.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "warn"
