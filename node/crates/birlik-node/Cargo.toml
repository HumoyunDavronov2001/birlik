[package]
name = "birlik-node"
description = "The BIRLIK agent that runs on every device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "birlik-node"
path = "src/main.rs"

[features]
# Integration tests that run a ring with a real birlik-engine; they need BIRLIK_ENGINE and BIRLIK_TEST_MODEL.
engine-tests = []

[[test]]
name = "ring"
required-features = ["engine-tests"]

[dependencies]
birlik-engine-host.workspace = true
birlik-network.workspace = true
birlik-protocol.workspace = true
clap.workspace = true
tokio.workspace = true
sysinfo.workspace = true
serde_json.workspace = true

[lints]
workspace = true
