[package]
name = "omnarc-node"
description = "The Omnarc agent that runs on every device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "omnarc-node"
path = "src/main.rs"

[features]
# Integration tests that run a ring with a real omnarc-engine; they need OMNARC_ENGINE and OMNARC_TEST_MODEL.
engine-tests = []

[[test]]
name = "ring"
required-features = ["engine-tests"]

[dependencies]
omnarc-engine-host.workspace = true
omnarc-network.workspace = true
omnarc-protocol.workspace = true
clap.workspace = true
tokio.workspace = true
sysinfo.workspace = true
serde_json.workspace = true
prost.workspace = true
redb.workspace = true
qrcode.workspace = true
n0-future.workspace = true
omnarc-api.workspace = true
omnarc-store.workspace = true
openraft.workspace = true
serde.workspace = true
axum.workspace = true

[dev-dependencies]
omnarc-store = { workspace = true, features = ["testing"] }
# a relay server inside the tests
iroh-relay = { version = "1.3", default-features = false, features = ["server"] }

[lints]
workspace = true
