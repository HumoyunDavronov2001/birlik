[package]
name = "omnarc-store"
description = "The model store of an Omnarc node: GGUF headers, the byte ranges of a window of layers, and models shared peer to peer over iroh-blobs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# the file store only: no RPC between processes
iroh-blobs = { workspace = true }
n0-future.workspace = true
omnarc-network.workspace = true
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
# marking files sparse, so a window of a model takes only its own disk space
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[features]
# small model files for the tests of other crates
testing = []

[dev-dependencies]
omnarc-store = { path = ".", features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# the workspace's lints, but unsafe code is denied rather than forbidden: one Windows call in src/sparse.rs needs it
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "warn"
