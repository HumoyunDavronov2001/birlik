[package]
name = "omnarc-network"
description = "Networking of Omnarc nodes: iroh QUIC endpoints, tensor streams, cluster identity and joining."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
omnarc-protocol.workspace = true
prost.workspace = true
biscuit-auth.workspace = true
blake3.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
iroh-gossip.workspace = true
# members on the same local network find each other by mDNS
iroh-mdns-address-lookup.workspace = true
# no relays, no address lookup, no port mapping: nothing leaves the device unless a peer is dialed
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
tokio = { workspace = true }
# the kind of the interface a link leaves by (Wi-Fi, Ethernet, ...)
netdev = { version = "0.46", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# a relay server inside the tests
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils"] }

[lints]
workspace = true
