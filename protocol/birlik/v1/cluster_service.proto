syntax = "proto3";

package birlik.v1;

import "birlik/v1/device.proto";
import "birlik/v1/pairing.proto";
import "birlik/v1/plan.proto";
import "birlik/v1/telemetry.proto";

// The control API every node serves to the panel and to apps (Connect RPC).
service ClusterService {
  // A snapshot of the cluster.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  // A live stream of changes; the first event is a full snapshot.
  rpc WatchCluster(WatchClusterRequest) returns (stream WatchClusterResponse);
  // Creates a one-time ticket for the QR code that adds a device.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
}

message ClusterSnapshot {
  ClusterId id = 1;
  string name = 2;
  repeated DeviceInfo devices = 3;
  repeated Telemetry telemetry = 4;
  repeated PlacementPlan plans = 5;
}

message GetClusterRequest {}

message GetClusterResponse {
  ClusterSnapshot cluster = 1;
}

message WatchClusterRequest {}

message WatchClusterResponse {
  oneof event {
    ClusterSnapshot snapshot = 1;
    DeviceInfo device_joined = 2;
    NodeId device_left = 3;
    Telemetry telemetry = 4;
    PlacementPlan plan_changed = 5;
  }
}

message CreateTicketRequest {
  // Ticket lifetime; the node caps it at 10 minutes.
  uint32 ttl_seconds = 1;
}

message CreateTicketResponse {
  ClusterTicket ticket = 1;
  // The ticket encoded for a QR code: "birlik:" + base32 of the serialized ticket.
  string qr_payload = 2;
}
