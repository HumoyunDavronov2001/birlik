syntax = "proto3";

package omnarc.v1;

import "omnarc/v1/device.proto";

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  // Lowest time per token for one request: the fastest devices plus speculative decoding.
  RUN_MODE_LATENCY = 1;
  // Most tokens per second across many requests: several pipelines and batching.
  RUN_MODE_THROUGHPUT = 2;
  // The largest model the cluster can hold, reading weights from disk when needed.
  RUN_MODE_CAPACITY = 3;
}

message ModelRef {
  // e.g. "Qwen3-32B".
  string name = 1;
  // e.g. "Q4_K_M".
  string quantization = 2;
  // BLAKE3 hash of the GGUF file.
  bytes blake3 = 3;
  uint32 layer_count = 4;
  uint32 hidden_dim = 5;
}

// A contiguous range of layers [layer_begin, layer_end) assigned to one device.
message Stage {
  NodeId node = 1;
  uint32 layer_begin = 2;
  uint32 layer_end = 3;
  Backend backend = 4;
  // Quantization used on this device, which may differ from other stages.
  string quantization = 5;
}

// A standby copy of a layer range that takes over when the primary stage drops.
message Replica {
  NodeId node = 1;
  uint32 layer_begin = 2;
  uint32 layer_end = 3;
}

// The placement agreed through Raft. Stages are listed in ring order.
message PlacementPlan {
  // Increases by one with every change; nodes ignore frames from older versions.
  uint64 version = 1;
  ModelRef model = 2;
  RunMode mode = 3;
  repeated Stage stages = 4;
  repeated Replica replicas = 5;
}
