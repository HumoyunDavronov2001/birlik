[workspace]
resolver = "3"
members = ["node/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HumoyunDavronov2001/birlik"
rust-version = "1.88"

[workspace.dependencies]
birlik-protocol = { path = "node/crates/birlik-protocol" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"
clap = { version = "4.6", features = ["derive"] }
sysinfo = "0.39"
serde_json = "1"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
