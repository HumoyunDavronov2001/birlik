[workspace]
resolver = "3"
members = ["node/crates/*"]
# built with nightly by cargo-fuzz, in a workspace of its own
exclude = ["node/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HumoyunDavronov2001/omnarc"
rust-version = "1.88"

[workspace.dependencies]
omnarc-protocol = { path = "node/crates/omnarc-protocol" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"
clap = { version = "4.6", features = ["derive"] }
sysinfo = "0.39"
serde_json = "1"
proptest = "1.12"
omnarc-engine-host = { path = "node/crates/omnarc-engine-host" }
omnarc-network = { path = "node/crates/omnarc-network" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "fs", "signal"] }
biscuit-auth = "6.0"
blake3 = "1.8"
data-encoding = "2.11"
getrandom = "0.4"
redb = "4.3"
n0-future = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
omnarc-api = { path = "node/crates/omnarc-api" }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
omnarc-store = { path = "node/crates/omnarc-store" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
